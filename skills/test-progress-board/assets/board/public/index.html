<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트 진행판</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231a7f4b'/%3E%3Cpath d='M4 8.3l2.7 2.7L12 5.2' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f3f5f7; --card:#fff; --ink:#17212b; --dim:#566472; --line:#dde3e8; --run:#1f6feb; --run-bg:#e8f0fe; --pass:#1a7f4b; --fail:#c2362b; --fail-bg:#fdecea; --idle:#a0acb7; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11161b; --card:#1a2128; --ink:#e6ebf0; --dim:#9aa8b5; --line:#2c3640; --run:#62a0ff; --run-bg:#1b2b45; --pass:#3fb97f; --fail:#ff7b6e; --fail-bg:#3a1f1d; --idle:#5f6d79; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; word-break:keep-all; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  main { max-width:1480px; margin:0 auto; padding:24px 24px 48px; }
  .empty { padding-top:20vh; text-align:center; color:var(--dim); }
  .top { display:flex; gap:16px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
  h1 { font-size:22px; line-height:1.3; margin:0; text-wrap:balance; overflow-wrap:anywhere; }
  .sub { margin:2px 0 0; color:var(--dim); font-variant-numeric:tabular-nums; }
  .off { color:var(--fail); }
  button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--run); outline-offset:2px; }
  .stop { font-weight:600; padding:8px 16px; } .stop:hover:not(:disabled) { border-color:var(--fail); color:var(--fail); } .stop:disabled { color:var(--dim); cursor:default; }
  .progress { display:flex; height:10px; margin:18px 0 12px; border-radius:5px; overflow:hidden; background:var(--line); }
  .progress i { display:block; transition:width .3s; } .progress .p { background:var(--pass); } .progress .f { background:var(--fail); } .progress .k { background:var(--idle); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; }
  .filters button { padding:3px 12px; font-size:13px; color:var(--dim); } .filters b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .filters button:hover { border-color:var(--dim); } .filters [aria-pressed=true] { border-color:var(--ink); color:var(--ink); } .filters .f-fail b { color:var(--fail); }
  .nowline { display:flex; align-items:center; gap:10px; margin:14px 0 16px; padding:12px 16px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--dim); min-height:50px; overflow-wrap:anywhere; }
  .nowline.on { background:var(--run-bg); border-color:var(--run); color:var(--ink); } .cur + .cur::before { content:" · "; color:var(--dim); }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:16px; align-items:start; }
  .group { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .group.run { border-color:var(--run); } .group.fail { border-color:var(--fail); }
  .group header { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  h2 { font-size:16px; margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; }
  .chip { flex:none; font-size:12px; font-weight:600; padding:1px 8px; border-radius:10px; border:1px solid currentColor; color:var(--dim); white-space:nowrap; }
  .chip.run { color:var(--run); } .chip.pass { color:var(--pass); } .chip.fail { color:var(--fail); }
  ol { list-style:none; margin:0; padding:6px 0; max-height:70vh; overflow:auto; }
  .item { display:flex; gap:10px; padding:7px 16px; } .item.run { background:var(--run-bg); } .item.fail { background:var(--fail-bg); }
  .item.wait .name, .item.skip .name, .item.stop .name { color:var(--dim); } .name { overflow-wrap:anywhere; }
  .mark { flex:none; width:20px; height:20px; margin-top:1px; border-radius:5px; border:2px solid var(--idle); }
  .mark svg { display:block; width:100%; height:100%; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .mark.pass { background:var(--pass); border-color:var(--pass); } .mark.fail { background:var(--fail); border-color:var(--fail); } .mark.skip, .mark.stop { background:var(--idle); }
  .mark.run, .spin { border-radius:50%; border:3px solid var(--run); border-right-color:transparent; animation:r 1s linear infinite; }
  .spin { flex:none; width:18px; height:18px; display:inline-block; } @keyframes r { to { transform:rotate(360deg); } }
  .body { flex:1; min-width:0; } .row { display:flex; gap:10px; justify-content:space-between; }
  .time { color:var(--dim); font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar { height:4px; margin-top:5px; border-radius:2px; background:var(--line); overflow:hidden; } .bar i { display:block; height:100%; background:var(--run); transition:width .5s linear; }
  .detail { margin:1px 0 0; font-size:13px; color:var(--dim); overflow-wrap:anywhere; white-space:pre-wrap; } .item.fail .detail { color:var(--fail); }
  @media (prefers-reduced-motion: reduce) { .mark.run, .spin { animation-duration:4s; } .progress i, .bar i { transition:none; } }
</style>
</head>
<body><div id="root"></div><script src="/app.js"></script></body>
</html>
